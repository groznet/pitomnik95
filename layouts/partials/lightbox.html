<div x-show="open" x-cloak x-transition.opacity @keydown.escape.window="close()" @click.self="close()" class="fixed inset-0 z-[80] grid place-items-center bg-surface-dark/95 p-4" role="dialog" aria-modal="true" aria-label="Просмотр фото">
  <button type="button" @click="close()" class="absolute right-5 top-5 grid h-12 w-12 place-items-center rounded-full bg-white/10 text-white hover:bg-accent hover:text-surface-dark" aria-label="Закрыть">{{ partial "icon.html" (dict "n" "close" "c" "h-6 w-6") }}</button>
  <img :src="src" :alt="alt" class="max-h-[88vh] max-w-full rounded-3xl object-contain shadow-botanical">
</div>
