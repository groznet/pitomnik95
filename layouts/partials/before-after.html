{{- /* Alpine before/after slider. Params: before (key), after (key), alt */ -}}
<div x-data="beforeAfter(50)" class="relative isolate aspect-[4/3] select-none overflow-hidden rounded-[2.5rem] shadow-botanical sm:aspect-[16/10]">
  <img src="{{ partial "img-url.html" (dict "key" .after "w" 1600) }}" alt="После: {{ .alt }}" class="absolute inset-0 h-full w-full object-cover" loading="lazy" draggable="false">
  <div class="absolute inset-0" :style="`clip-path: inset(0 ${100 - pos}% 0 0)`">
    <img src="{{ partial "img-url.html" (dict "key" .before "w" 1600) }}" alt="До: {{ .alt }}" class="h-full w-full object-cover saturate-[.35] sepia-[.35] brightness-90" loading="lazy" draggable="false">
  </div>
  <span class="absolute left-4 top-4 z-10 rounded-full bg-surface-dark/80 px-4 py-1.5 font-heading text-xs font-semibold uppercase tracking-widest text-white backdrop-blur">До</span>
  <span class="absolute right-4 top-4 z-10 rounded-full bg-accent px-4 py-1.5 font-heading text-xs font-semibold uppercase tracking-widest text-surface-dark">После</span>
  <div class="pointer-events-none absolute inset-y-0 z-10 w-0" :style="`left:${pos}%`">
    <div class="absolute inset-y-0 -translate-x-1/2 w-0.5 bg-white/90"></div>
    <div class="absolute top-1/2 grid h-12 w-12 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-full bg-white text-primary shadow-glow"><svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 7-5 5 5 5M15 7l5 5-5 5"/></svg></div>
  </div>
  <input type="range" min="0" max="100" step="0.5" x-model.number="pos" class="ba-range absolute inset-0 z-20 h-full w-full opacity-0" aria-label="Сравнить до и после: положение слайдера">
</div>
